<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — LORIMER®</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sometype+Mono:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-body">

  <nav class="navbar">
    <div class="navbar__links">
      <a href="index.html">HOME</a>
      <a href="ss24.html">S/S_24</a>
    </div>
    <a class="navbar__logo" href="index.html">LORIMER®</a>
    <div class="navbar__right">
      <a href="shop.html">SHOP</a>
      <a href="#">ABOUT</a>
      <button class="cart-btn open-cart">CART <span class="cart-count"></span></button>
    </div>
  </nav>

  <main>
    <div class="checkout-layout">

      <!-- Left: Form -->
      <div class="checkout-form reveal">

        <!-- Success state (hidden by default, shown after successful order) -->
        <div class="order-success" id="order-success">
          <h2>Order Confirmed</h2>
          <p>Thank you for your order. We'll be in touch shortly.</p>
          <a href="index.html">Continue Shopping</a>
        </div>

        <form id="checkout-form" novalidate>
          <h2>Customer Information</h2>

          <div class="form-row">
            <div class="form-group">
              <label for="first-name">First Name</label>
              <input type="text" id="first-name" name="first-name" required autocomplete="given-name">
            </div>
            <div class="form-group">
              <label for="last-name">Last Name</label>
              <input type="text" id="last-name" name="last-name" required autocomplete="family-name">
            </div>
          </div>

          <div class="form-row single">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required autocomplete="email">
            </div>
          </div>

          <div class="form-row single">
            <div class="form-group">
              <label for="address">Address</label>
              <input type="text" id="address" name="address" required autocomplete="street-address">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" name="city" required autocomplete="address-level2">
            </div>
            <div class="form-group">
              <label for="zip">ZIP / Postal Code</label>
              <input type="text" id="zip" name="zip" required autocomplete="postal-code">
            </div>
          </div>

          <div class="form-row single">
            <div class="form-group">
              <label for="country">Country</label>
              <select id="country" name="country" required autocomplete="country">
                <option value="">Select country</option>
                <option value="ES">Spain</option>
                <option value="US">United States</option>
                <option value="GB">United Kingdom</option>
                <option value="FR">France</option>
                <option value="DE">Germany</option>
                <option value="IT">Italy</option>
                <option value="JP">Japan</option>
                <option value="AU">Australia</option>
                <option value="CA">Canada</option>
              </select>
            </div>
          </div>

          <hr class="form-divider">
          <p class="form-section-label">Payment Details</p>

          <div class="form-row single">
            <div class="form-group">
              <label for="card-number">Card Number</label>
              <input type="text" id="card-number" name="card-number" placeholder="0000 0000 0000 0000" maxlength="19" required autocomplete="cc-number">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="card-expiry">Expiry (MM/YY)</label>
              <input type="text" id="card-expiry" name="card-expiry" placeholder="MM/YY" maxlength="5" required autocomplete="cc-exp">
            </div>
            <div class="form-group">
              <label for="card-cvc">CVC</label>
              <input type="text" id="card-cvc" name="card-cvc" placeholder="000" maxlength="4" required autocomplete="cc-csc">
            </div>
          </div>

          <button type="submit" class="btn-place-order">Place Order</button>
        </form>

      </div>

      <!-- Right: Order Summary -->
      <div class="checkout-summary reveal reveal-delay-1">
        <h2>Order Summary</h2>
        <div class="summary-items" id="summary-items">
          <!-- Rendered by checkout.js -->
        </div>
        <div class="summary-totals">
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="summary-subtotal">$0</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span>Free</span>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <span id="summary-total">$0</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="footer__col">
      <p>ABOUT</p>
      <p>MONDA ESP, 28012</p>
      <a href="#">PRIVACY</a>
    </div>
    <div class="footer__col">
      <p>CONTACT</p>
      <p>+34 664 65 6820</p>
      <a href="#">SHIPPING INFORMATION</a>
    </div>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/animations.js"></script>

</body>
</html>
