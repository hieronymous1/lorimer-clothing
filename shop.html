<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — LORIMER®</title>
  <link rel="icon" href="./assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-body shop-page">

  <nav class="navbar">
    <a class="navbar__item" href="ss24.html">S/S_24</a>
    <a class="navbar__item" href="shop.html">PRODUCTS</a>
    <a class="navbar__logo" href="index.html"><img src="./assets/logo.png" alt="LORIMER®"></a>
    <a class="navbar__item" href="about.html">ABOUT</a>
    <button class="cart-btn open-cart">CART <span class="cart-count">(0)</span></button>
    <button class="navbar__hamburger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu"><span></span><span></span><span></span></button>
  </nav>

  <main class="shop-layout">
    <aside class="shop-sidebar" aria-label="Shop filters">
      <button class="shop-sidebar__title filter-btn filter-btn--all active" type="button" data-filter="All" aria-pressed="true">Shop All</button>
      <div class="shop-filters" role="group" aria-label="Filter products">
        <button class="filter-btn" type="button" data-filter="Tops" aria-pressed="false" aria-expanded="false">Tops</button>
        <div class="shop-subfilters" role="group" aria-label="Tops subcategories">
          <button class="filter-btn filter-btn--sub" type="button" data-filter="Shirts" aria-pressed="false">Shirts</button>
          <button class="filter-btn filter-btn--sub" type="button" data-filter="Women's Tops" aria-pressed="false">Women's Tops</button>
          <button class="filter-btn filter-btn--sub" type="button" data-filter="Jackets" aria-pressed="false">Jackets</button>
          <button class="filter-btn filter-btn--sub" type="button" data-filter="Sweatshirts" aria-pressed="false">Sweatshirts</button>
          <button class="filter-btn filter-btn--sub" type="button" data-filter="Vests" aria-pressed="false">Vests</button>
        </div>
        <button class="filter-btn" type="button" data-filter="Bottoms" aria-pressed="false" aria-expanded="false">Bottoms</button>
        <div class="shop-subfilters" role="group" aria-label="Bottoms subcategories">
          <button class="filter-btn filter-btn--sub" type="button" data-filter="Skirts" aria-pressed="false">Skirts</button>
          <button class="filter-btn filter-btn--sub" type="button" data-filter="Trousers" aria-pressed="false">Trousers</button>
          <button class="filter-btn filter-btn--sub" type="button" data-filter="Denim" aria-pressed="false">Denim</button>
        </div>
        <button class="filter-btn" type="button" data-filter="S/S 24" aria-pressed="false">S/S 24</button>
        <button class="filter-btn" type="button" data-filter="Dresses" aria-pressed="false">Dresses</button>
        <button class="filter-btn" type="button" data-filter="Accessories" aria-pressed="false">Accessories</button>
      </div>
    </aside>
    <section class="shop-grid-wrap" aria-label="Lorimer product catalog">
      <div class="shop-grid" id="shop-grid"></div>
      <p class="sr-only" id="shop-results-status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="footer" id="about">
    <div class="footer__col"><p>ABOUT</p><p data-cms-key="footer.copyright">© Lorimer 2026</p><p data-cms-key="footer.location">Helsinki, 00750</p></div>
    <div class="footer__col footer__col--right"><p>NEWSLETTER</p><a href="mailto:contact@lorimer.com">contact@lorimer.com</a><a href="https://www.instagram.com/lorimer.clo/" rel="noopener noreferrer">@Lorimer.Clo</a></div>
  </footer>

  <script src="js/products-data.js?v=11"></script>
  <script>window.__LORIMER_SCRIPTS_AFTER__ = ['js/cart.js?v=6','js/main.js?v=7','js/shop.js?v=10','js/animations.js','js/cursor.js'];</script>
  <script src="js/products-remote.js"></script>
  <script src="js/content-remote.js"></script>

</body>
</html>
