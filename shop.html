<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — LORIMER®</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-body">

  <nav class="navbar">
    <a class="navbar__item" href="ss24.html">S/S_24</a>
    <a class="navbar__item" href="shop.html">SHOP</a>
    <a class="navbar__logo" href="index.html"><img src="./assets/logo.png" alt="LORIMER®"></a>
    <a class="navbar__item" href="about.html">ABOUT</a>
    <button class="cart-btn open-cart">CART <span class="cart-count">(0)</span></button>
  </nav>

  <main class="shop-layout">
    <aside class="shop-sidebar" aria-label="Shop filters">
      <p class="shop-sidebar__title">SHOP</p>
      <div class="shop-filters" role="group" aria-label="Filter products">
        <button class="filter-btn active" type="button" data-filter="All" aria-pressed="true">All</button>
        <button class="filter-btn" type="button" data-filter="Jackets" aria-pressed="false">Jackets</button>
        <button class="filter-btn" type="button" data-filter="Tops" aria-pressed="false">Tops</button>
        <button class="filter-btn" type="button" data-filter="Bottoms" aria-pressed="false">Bottoms</button>
        <button class="filter-btn" type="button" data-filter="Accessories" aria-pressed="false">Accessories</button>
      </div>
    </aside>
    <section class="shop-grid-wrap" aria-label="Lorimer product catalog">
      <div class="shop-grid" id="shop-grid"></div>
      <p class="sr-only" id="shop-results-status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="footer" id="about">
    <div class="footer__col"><p>ABOUT</p><p>© Lorimer 2026</p><p>Helsinki, 00750</p></div>
    <div class="footer__col footer__col--right"><p>NEWSLETTER</p><a href="mailto:contact@lorimer.com">contact@lorimer.com</a><a href="https://www.instagram.com/lorimer.clo/" rel="noopener noreferrer">@Lorimer.Clo</a></div>
  </footer>

  <script src="js/products-data.js"></script>
  <script src="js/cart.js?v=4"></script>
  <script src="js/main.js?v=4"></script>
  <script src="js/shop.js?v=4"></script>
  <script src="js/animations.js"></script>

</body>
</html>
