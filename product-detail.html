<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — LORIMER®</title>
  <link rel="icon" href="./assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-body">

  <nav class="navbar">
    <a class="navbar__item" href="ss24.html">S/S_24</a>
    <a class="navbar__item" href="shop.html">PRODUCTS</a>
    <a class="navbar__logo" href="index.html"><img src="./assets/logo.png" alt="LORIMER®"></a>
    <a class="navbar__item" href="about.html">ABOUT</a>
    <button class="cart-btn open-cart">CART <span class="cart-count">(0)</span></button>
    <button class="navbar__hamburger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu"><span></span><span></span><span></span></button>
  </nav>

  <main class="product-layout">
    <!-- Left: Scrolling image gallery -->
    <div class="product-gallery-wrap">
      <div class="product-mobile-bar" id="product-mobile-bar">
        <p class="product-mobile-bar__name" id="mobile-product-name"></p>
        <p class="product-mobile-bar__price" id="mobile-product-price"></p>
      </div>
      <div class="product-gallery" id="product-gallery" aria-label="Product images"></div>
    </div>

    <!-- Right: Product Info -->
    <div class="product-info">
      <h1 class="product-info__name reveal" id="product-name"></h1>
      <p class="product-info__price reveal reveal-delay-1" id="product-price"></p>

      <div class="product-info__section reveal reveal-delay-2" id="color-section" hidden>
        <p class="size-label">Select Color</p>
        <div class="color-swatches" id="color-swatches"></div>
      </div>

      <div class="product-info__section reveal reveal-delay-2" id="finish-section" hidden>
        <p class="size-label">Choose Finish</p>
        <div class="finish-grid" id="finish-grid"></div>
      </div>

      <div class="product-info__section reveal reveal-delay-3" id="size-section">
        <div class="size-label-row">
          <p class="size-label">Select Size</p>
          <button class="size-guide-trigger" id="size-guide-trigger" type="button">Size Guide</button>
        </div>
        <div class="size-grid" id="size-grid"></div>
        <p class="size-error" id="size-error">Please select a size</p>
      </div>

      <button class="btn-add-cart reveal reveal-delay-4" id="add-to-cart">
        <span class="btn-add-cart__label">Add to Cart</span>
        <svg class="btn-add-cart__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5L9.5 18L20 6"/></svg>
      </button>

      <div class="product-info__section product-info__section--text reveal reveal-delay-5">
        <div class="product-info__long-desc" id="product-desc"></div>
        <p class="product-info__meta" id="product-material"></p>
      </div>

      <div class="product-info__section reveal reveal-delay-6" id="style-with-section" hidden>
        <p class="size-label">Style It With</p>
        <div class="style-with-grid" id="style-with-grid"></div>
      </div>

      <a href="shop.html" class="product-info__back reveal reveal-delay-7">&larr; Back to Products</a>
    </div>
  </main>

  <footer class="footer" id="about">
    <div class="footer__col"><p>ABOUT</p><p>© Lorimer 2026</p><p>Helsinki, 00750</p></div>
    <div class="footer__col footer__col--right"><p>NEWSLETTER</p><a href="mailto:contact@lorimer.com">contact@lorimer.com</a><a href="https://www.instagram.com/lorimer.clo/" rel="noopener noreferrer">@Lorimer.Clo</a></div>
  </footer>

  <script src="js/products-data.js?v=11"></script>
  <script>window.__LORIMER_SCRIPTS_AFTER__ = ['js/cart.js?v=6','js/main.js?v=7','js/product.js?v=8','js/animations.js','js/cursor.js'];</script>
  <script src="js/products-remote.js"></script>

</body>
</html>
