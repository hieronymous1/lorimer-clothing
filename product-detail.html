<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — LORIMER®</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-body">

  <nav class="navbar">
    <a class="navbar__item" href="ss24.html">S/S_24</a>
    <a class="navbar__item" href="shop.html">PRODUCTS</a>
    <a class="navbar__logo" href="index.html"><img src="./assets/logo.png" alt="LORIMER®"></a>
    <a class="navbar__item" href="about.html">ABOUT</a>
    <button class="cart-btn open-cart">CART <span class="cart-count">(0)</span></button>
  </nav>

  <main class="product-layout">
    <!-- Left: Scrolling image gallery -->
    <div class="product-gallery" id="product-gallery" aria-label="Product images"></div>

    <!-- Right: Product Info -->
    <div class="product-info">
      <h1 class="product-info__name reveal" id="product-name"></h1>
      <p class="product-info__price reveal reveal-delay-1" id="product-price"></p>

      <div class="reveal reveal-delay-2" id="color-section" hidden>
        <p class="size-label">Select Color</p>
        <div class="color-swatches" id="color-swatches"></div>
      </div>

      <div class="reveal reveal-delay-3" id="size-section">
        <p class="size-label">Select Size</p>
        <div class="size-grid" id="size-grid"></div>
        <p class="size-error" id="size-error">Please select a size</p>
      </div>

      <button class="btn-add-cart reveal reveal-delay-4" id="add-to-cart">Add to Cart</button>

      <div class="product-info__long-desc reveal reveal-delay-5" id="product-desc"></div>
      <p class="product-info__meta reveal reveal-delay-5" id="product-material"></p>

      <div class="reveal reveal-delay-6" id="style-with-section" hidden>
        <p class="size-label">Style It With</p>
        <div class="style-with-grid" id="style-with-grid"></div>
      </div>

      <a href="shop.html" class="reveal reveal-delay-7" style="font-family:var(--font-title);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;opacity:0.5;">&larr; Back to Products</a>
    </div>
  </main>

  <footer class="footer" id="about">
    <div class="footer__col"><p>ABOUT</p><p>© Lorimer 2026</p><p>Helsinki, 00750</p></div>
    <div class="footer__col footer__col--right"><p>NEWSLETTER</p><a href="mailto:contact@lorimer.com">contact@lorimer.com</a><a href="https://www.instagram.com/lorimer.clo/" rel="noopener noreferrer">@Lorimer.Clo</a></div>
  </footer>

  <script src="js/products-data.js?v=8"></script>
  <script src="js/cart.js?v=6"></script>
  <script src="js/main.js?v=6"></script>
  <script src="js/product.js?v=6"></script>
  <script src="js/animations.js"></script>

</body>
</html>
