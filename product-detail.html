<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sometype+Mono:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

<body class="page-body">

  <nav class="navbar">
    <div class="navbar__links">
      <a href="index.html">HOME</a>
      <a href="ss24.html">S/S_24</a>
    </div>
    <a class="navbar__logo" href="index.html">LORIMER®</a>
    <div class="navbar__right">
      <a href="shop.html">SHOP</a>
      <a href="#">ABOUT</a>
      <button class="cart-btn open-cart">CART <span class="cart-count"></span></button>
    </div>
  </nav>

  <main class="product-layout">
    <!-- Left: Image Gallery -->
    <div class="product-gallery">
      <img class="gallery-main" id="gallery-main" src="" alt="">
      <div class="gallery-thumbs" id="gallery-thumbs"></div>
    </div>

    <!-- Right: Product Info -->
    <div class="product-info">
      <h1 class="product-info__name reveal" id="product-name"></h1>
      <p class="product-info__price reveal reveal-delay-1" id="product-price"></p>
      <p class="product-info__desc reveal reveal-delay-2" id="product-desc"></p>
      <p class="product-info__meta reveal reveal-delay-3" id="product-material"></p>

      <div class="reveal reveal-delay-4">
        <p class="size-label">Select Size</p>
        <div class="size-grid" id="size-grid"></div>
        <p class="size-error" id="size-error">Please select a size</p>
      </div>

      <button class="btn-add-cart reveal reveal-delay-5" id="add-to-cart">Add to Cart</button>

      <a href="shop.html" class="reveal reveal-delay-6" style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;opacity:0.5;">&larr; Back to Shop</a>
    </div>
  </main>

  <footer class="footer">
    <div class="footer__col">
      <p>ABOUT</p>
      <p>MONDA ESP, 28012</p>
      <a href="#">PRIVACY</a>
    </div>
    <div class="footer__col">
      <p>CONTACT</p>
      <p>+34 664 65 6820</p>
      <a href="#">SHIPPING INFORMATION</a>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/product.js"></script>
  <script src="js/animations.js"></script>
